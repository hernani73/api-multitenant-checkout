services:
  api_saas:
    build: .
    container_name: api-multitenant-checkout-container
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=development
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    restart: always
